# ==================================================
# CONFIGURATION IMPORT
# ==================================================
spring.config.import=optional:file:.env[.properties]

# ==================================================
# DATABASE CONFIGURATION
# ==================================================


spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:project}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DB_USER:root}}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==================================================
# JPA CONFIGURATION
# ==================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ==================================================
# SERVER
# ==================================================

server.port=${PORT:8080}
server.address=0.0.0.0


# ==================================================
# JWT CONFIGURATION
# ==================================================

jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000


# ==================================================
# RAZORPAY CONFIGURATION
# ==================================================

razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}


# ==================================================
# FILE UPLOAD
# ==================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB


# ==================================================
# LOGGING
# ==================================================

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


# ==================================================
# MAIL CONFIGURATION
# ==================================================
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:${TV_MAIL_USERNAME:}}
spring.mail.password=${MAIL_PASSWORD:${TV_MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:${MAIL_SMTP_STARTTLS:true}}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:${MAIL_SMTP_SSL:false}}
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.from=${MAIL_FROM:supritabiradar3@gmail.com}
mail.smtp.diagnostic.enabled=${MAIL_SMTP_DIAGNOSTIC:false}

logging.level.org.springframework.mail=INFO
logging.level.org.eclipse.angus.mail=INFO


# ==================================================
# HUGGING FACE AI CONFIGURATION
# ==================================================
huggingface.api.token=${HUGGINGFACE_API_TOKEN:}
huggingface.api.model=${HUGGINGFACE_API_MODEL:Qwen/Qwen2.5-7B-Instruct}
huggingface.api.url=https://router.huggingface.co/v1/chat/completions

# ==================================================
# ADMIN INITIALIZATION
# ==================================================
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}

# ==================================================
# CORS CONFIGURATION
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://timeverse-xpo135qhj-time-verse1.vercel.app,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080}
